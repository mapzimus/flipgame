name: Build offline APK

on:
  workflow_dispatch:        # lets you build it on demand from the Actions tab
  push:
    branches: [master]

concurrency:
  group: flipgame-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write           # needed to publish the APK as a Release asset

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run v1.11 qualification suites
        shell: bash
        run: |
          set -euo pipefail
          for test_file in scripts/*test*.js; do
            echo "RUN $test_file"
            node "$test_file"
          done
          node --test tests/*.test.js

      - name: Bundle the game files into the APK assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html css js icons manifest.json android/app/src/main/assets/
          mkdir -p android/app/src/main/res/drawable
          cp icons/icon-512.png android/app/src/main/res/drawable/ic_launcher.png

      - name: Record source and release metadata
        id: build_metadata
        run: |
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "$GITHUB_SHA"
          release_version="$(node -p "require('./js/v111-interfaces.js').RELEASE_VERSION")"
          short_commit="$(git rev-parse --short=12 HEAD)"
          SOURCE_COMMIT="$source_commit" RELEASE_VERSION="$release_version" node -e \
            "require('fs').writeFileSync('android/app/src/main/assets/build-metadata.json', JSON.stringify({sourceCommit:process.env.SOURCE_COMMIT,releaseVersion:process.env.RELEASE_VERSION}, null, 2) + '\n')"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "short_commit=$short_commit" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Decode persistent release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flipgame-release.keystore"
          chmod 600 "$RUNNER_TEMP/flipgame-release.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/flipgame-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk flipgame-offline.apk

      - name: Verify APK identity, signature, and bundled commit
        shell: bash
        run: |
          set -euo pipefail
          unzip -p flipgame-offline.apk assets/build-metadata.json > apk-build-metadata.json
          cmp android/app/src/main/assets/build-metadata.json apk-build-metadata.json
          SOURCE_COMMIT="${{ steps.build_metadata.outputs.source_commit }}" \
            RELEASE_VERSION="${{ steps.build_metadata.outputs.release_version }}" \
            node -e "const m=require('./apk-build-metadata.json'); if(m.sourceCommit!==process.env.SOURCE_COMMIT||m.releaseVersion!==process.env.RELEASE_VERSION) process.exit(1)"
          apksigner verify --verbose --print-certs flipgame-offline.apk | tee apk-signing-certificate.txt
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$aapt_bin"
          "$aapt_bin" dump badging flipgame-offline.apk | tee apk-badging.txt
          grep -q "versionCode='111'" apk-badging.txt
          grep -q "versionName='1.11'" apk-badging.txt
          sha256sum flipgame-offline.apk > flipgame-offline.apk.sha256
          rm -f "$RUNNER_TEMP/flipgame-release.keystore"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flipgame-offline-apk-${{ steps.build_metadata.outputs.short_commit }}
          path: |
            flipgame-offline.apk
            flipgame-offline.apk.sha256
            apk-build-metadata.json
            apk-signing-certificate.txt
            apk-badging.txt

      - name: Publish immutable release and refresh apk-latest
        if: github.ref == 'refs/heads/master'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.build_metadata.outputs.release_version }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<NOTES
          Self-contained, persistently signed Flipgame ${RELEASE_VERSION} APK. Game files are
          bundled for offline play. Sideload it by enabling “Install unknown
          apps” and opening the APK. The legacy v110 APK used a disposable CI
          key and must be uninstalled once; signed releases from v1.11 onward
          can upgrade in place.
          NOTES
          assets=(flipgame-offline.apk flipgame-offline.apk.sha256 apk-build-metadata.json apk-signing-certificate.txt apk-badging.txt)
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}"
            tag_sha="$(git rev-list -n 1 "$RELEASE_VERSION")"
            test "$tag_sha" = "$GITHUB_SHA"
            gh release upload "$RELEASE_VERSION" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_VERSION" --target "$GITHUB_SHA" --title "Flip Game ${RELEASE_VERSION}" --notes-file release-notes.md "${assets[@]}"
          fi
          gh release delete apk-latest --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create apk-latest --target "$GITHUB_SHA" --title "Flip Game — offline APK (latest)" --notes-file release-notes.md "${assets[@]}"

  publish_mapzimus:
    name: Publish mapzimus.com/flipgame
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact qualified Flipgame commit
        uses: actions/checkout@v4
        with:
          path: flipgame
          fetch-depth: 0

      - name: Refuse an obsolete production run
        shell: bash
        run: |
          set -euo pipefail
          git -C flipgame fetch origin master --depth=1
          test "$(git -C flipgame rev-parse origin/master)" = "$GITHUB_SHA"
          test "$(git -C flipgame rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Check out the Lab production repository
        uses: actions/checkout@v4
        with:
          repository: mapzimus/lab
          ref: main
          path: lab
          fetch-depth: 0
          ssh-key: ${{ secrets.LAB_DEPLOY_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lab/package-lock.json

      - name: Sync the exact web runtime into /flipgame/
        shell: bash
        run: node lab/scripts/sync-flipgame.mjs --source flipgame --source-commit "$GITHUB_SHA"

      - name: Qualify the complete Lab site
        working-directory: lab
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check

      - name: Commit and push only the Flipgame snapshot
        shell: bash
        run: |
          set -euo pipefail
          git -C lab add -- vendor/apps/flip-game
          if git -C lab diff --cached --quiet; then
            echo "Lab already contains Flipgame $GITHUB_SHA."
            exit 0
          fi
          git -C lab config user.name "flipgame-release-bot"
          git -C lab config user.email "flipgame-release-bot@users.noreply.github.com"
          git -C lab commit -m "chore: sync Flipgame ${GITHUB_SHA:0:12}"
          git -C lab fetch origin main
          test "$(git -C lab rev-parse HEAD^)" = "$(git -C lab rev-parse origin/main)"
          git -C lab push origin HEAD:main
