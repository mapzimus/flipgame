name: Build offline APK

on:
  workflow_dispatch:        # lets you build it on demand from the Actions tab
  push:
    branches: [master]

concurrency:
  group: flipgame-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.build_metadata.outputs.release_version }}
      short_commit: ${{ steps.build_metadata.outputs.short_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject a reused public release identity
        shell: bash
        run: |
          set -euo pipefail
          release_version="$(node -p "require('./js/v111-interfaces.js').RELEASE_VERSION")"
          if git ls-remote --exit-code --tags origin "refs/tags/${release_version}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/tags/${release_version}:refs/tags/${release_version}"
            tag_sha="$(git rev-list -n 1 "$release_version")"
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Release ${release_version} already belongs to ${tag_sha}; bump the public version, cache, asset build, and Android version before publishing another commit." >&2
              exit 1
            fi
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run v1.11 qualification suites
        shell: bash
        run: |
          set -euo pipefail
          for test_file in scripts/*test*.js; do
            echo "RUN $test_file"
            node "$test_file"
          done
          node --test tests/*.test.js

      - name: Bundle the game files into the APK assets
        run: |
          mkdir -p android/app/src/main/assets
          cp -r index.html css js icons manifest.json android/app/src/main/assets/
          mkdir -p android/app/src/main/res/drawable
          cp icons/icon-512.png android/app/src/main/res/drawable/ic_launcher.png

      - name: Record source and release metadata
        id: build_metadata
        run: |
          source_commit="$(git rev-parse HEAD)"
          test "$source_commit" = "$GITHUB_SHA"
          release_version="$(node -p "require('./js/v111-interfaces.js').RELEASE_VERSION")"
          short_commit="$(git rev-parse --short=12 HEAD)"
          SOURCE_COMMIT="$source_commit" RELEASE_VERSION="$release_version" node -e \
            "require('fs').writeFileSync('android/app/src/main/assets/build-metadata.json', JSON.stringify({sourceCommit:process.env.SOURCE_COMMIT,releaseVersion:process.env.RELEASE_VERSION}, null, 2) + '\n')"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "short_commit=$short_commit" >> "$GITHUB_OUTPUT"
          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"

      - name: Decode persistent release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flipgame-release.keystore"
          chmod 600 "$RUNNER_TEMP/flipgame-release.keystore"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/flipgame-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk flipgame-offline.apk

      - name: Verify APK identity, signature, and bundled commit
        shell: bash
        run: |
          set -euo pipefail
          unzip -p flipgame-offline.apk assets/build-metadata.json > apk-build-metadata.json
          cmp android/app/src/main/assets/build-metadata.json apk-build-metadata.json
          SOURCE_COMMIT="${{ steps.build_metadata.outputs.source_commit }}" \
            RELEASE_VERSION="${{ steps.build_metadata.outputs.release_version }}" \
            node -e "const m=require('./apk-build-metadata.json'); if(m.sourceCommit!==process.env.SOURCE_COMMIT||m.releaseVersion!==process.env.RELEASE_VERSION) process.exit(1)"
          apksigner_bin="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner_bin"
          "$apksigner_bin" verify --verbose --print-certs flipgame-offline.apk | tee apk-signing-certificate.txt
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$aapt_bin"
          "$aapt_bin" dump badging flipgame-offline.apk | tee apk-badging.txt
          grep -q "versionCode='111'" apk-badging.txt
          grep -q "versionName='1.11'" apk-badging.txt
          sha256sum flipgame-offline.apk > flipgame-offline.apk.sha256
          rm -f "$RUNNER_TEMP/flipgame-release.keystore"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flipgame-offline-apk-${{ steps.build_metadata.outputs.short_commit }}
          path: |
            flipgame-offline.apk
            flipgame-offline.apk.sha256
            apk-build-metadata.json
            apk-signing-certificate.txt
            apk-badging.txt

  publish_mapzimus:
    name: Publish mapzimus.com/flipgame
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the exact qualified Flipgame commit
        uses: actions/checkout@v4
        with:
          path: flipgame
          fetch-depth: 0

      - name: Refuse an obsolete production run
        shell: bash
        run: |
          set -euo pipefail
          git -C flipgame fetch origin master --depth=1
          test "$(git -C flipgame rev-parse origin/master)" = "$GITHUB_SHA"
          test "$(git -C flipgame rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Check out the Lab production repository
        uses: actions/checkout@v4
        with:
          repository: mapzimus/lab
          ref: main
          path: lab
          fetch-depth: 0
          ssh-key: ${{ secrets.LAB_DEPLOY_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lab/package-lock.json

      - name: Sync the exact web runtime into /flipgame/
        shell: bash
        run: node lab/scripts/sync-flipgame.mjs --source flipgame --source-commit "$GITHUB_SHA"

      - name: Qualify the complete Lab site
        working-directory: lab
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run check

      - name: Revalidate both production branches
        shell: bash
        run: |
          set -euo pipefail
          git -C flipgame fetch origin master --depth=1
          test "$(git -C flipgame rev-parse origin/master)" = "$GITHUB_SHA"
          test "$(git -C flipgame rev-parse HEAD)" = "$GITHUB_SHA"
          git -C lab fetch origin main
          test "$(git -C lab rev-parse HEAD)" = "$(git -C lab rev-parse origin/main)"

      - name: Commit and push only the Flipgame snapshot
        shell: bash
        run: |
          set -euo pipefail
          git -C flipgame fetch origin master --depth=1
          test "$(git -C flipgame rev-parse origin/master)" = "$GITHUB_SHA"
          git -C lab fetch origin main
          test "$(git -C lab rev-parse HEAD)" = "$(git -C lab rev-parse origin/main)"
          git -C lab add -- vendor/apps/flip-game
          if git -C lab diff --cached --quiet; then
            echo "Lab already contains Flipgame $GITHUB_SHA."
            exit 0
          fi
          git -C lab config user.name "flipgame-release-bot"
          git -C lab config user.email "flipgame-release-bot@users.noreply.github.com"
          git -C lab commit -m "chore: sync Flipgame ${GITHUB_SHA:0:12}"
          git -C flipgame fetch origin master --depth=1
          test "$(git -C flipgame rev-parse origin/master)" = "$GITHUB_SHA"
          git -C lab fetch origin main
          test "$(git -C lab rev-parse HEAD^)" = "$(git -C lab rev-parse origin/main)"
          git -C lab push origin HEAD:main

      - name: Wait for the verified Cloudflare publication
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error --max-time 15 \
              "https://mapzimus.com/flipgame/release-provenance.json?commit=${GITHUB_SHA}" \
              --output lab-upstream.json && \
              EXPECTED_SHA="$GITHUB_SHA" node -e \
                "const m=require('./lab-upstream.json');if(m?.upstream?.sourceSha!==process.env.EXPECTED_SHA)process.exit(1)"; then
              exit 0
            fi
            sleep 5
          done
          echo "Cloudflare did not publish Flipgame $GITHUB_SHA within five minutes." >&2
          exit 1

      - name: Preserve the verified web provenance
        uses: actions/upload-artifact@v4
        with:
          name: flipgame-web-provenance-${{ github.sha }}
          path: lab-upstream.json
          if-no-files-found: error
          retention-days: 7

  deploy_github_pages:
    name: Publish mapzimus.github.io/flipgame
    needs: publish_mapzimus
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the exact qualified Flipgame commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download the Cloudflare-verified provenance
        uses: actions/download-artifact@v4
        with:
          name: flipgame-web-provenance-${{ github.sha }}
          path: web-provenance

      - name: Stage only the web runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --depth=1
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir pages-site
          cp -R index.html service-worker.js manifest.json css js icons pages-site/
          if [ -f .nojekyll ]; then cp .nojekyll pages-site/; fi
          cp web-provenance/lab-upstream.json pages-site/release-provenance.json
          EXPECTED_SHA="$GITHUB_SHA" node -e \
            "const m=require('./pages-site/release-provenance.json');if(m?.upstream?.sourceSha!==process.env.EXPECTED_SHA)process.exit(1)"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the exact Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Recheck master immediately before publication
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --depth=1
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify_dual_origins:
    name: Verify both public Flipgame origins
    needs: [publish_mapzimus, deploy_github_pages]
    if: always() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Require both publication jobs
        env:
          LAB_RESULT: ${{ needs.publish_mapzimus.result }}
          PAGES_RESULT: ${{ needs.deploy_github_pages.result }}
        run: test "$LAB_RESULT" = success && test "$PAGES_RESULT" = success
      - name: Reconcile provenance and every runtime byte
        run: node scripts/verify-dual-deployment.mjs --sha "$GITHUB_SHA"

  publish_release:
    name: Publish the signed v1.11 APK release
    needs: [build, verify_dual_origins]
    if: always() && github.ref == 'refs/heads/master' && needs.build.result == 'success' && needs.verify_dual_origins.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the exact dual-origin-verified commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recheck master before publishing the release
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master --depth=1
          test "$(git rev-parse origin/master)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Download the qualified signed APK
        uses: actions/download-artifact@v4
        with:
          name: flipgame-offline-apk-${{ needs.build.outputs.short_commit }}
          path: release-assets

      - name: Publish immutable release and refresh apk-latest
        working-directory: release-assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.release_version }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_VERSION"
          cat > release-notes.md <<NOTES
          Self-contained, persistently signed Flipgame ${RELEASE_VERSION} APK. Game files are
          bundled for offline play. Sideload it by enabling “Install unknown
          apps” and opening the APK. The legacy v110 APK used a disposable CI
          key and must be uninstalled once; signed releases from v1.11 onward
          can upgrade in place.
          NOTES
          assets=(flipgame-offline.apk flipgame-offline.apk.sha256 apk-build-metadata.json apk-signing-certificate.txt apk-badging.txt)
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            git -C .. fetch --no-tags origin "refs/tags/${RELEASE_VERSION}:refs/tags/${RELEASE_VERSION}"
            tag_sha="$(git -C .. rev-list -n 1 "$RELEASE_VERSION")"
            test "$tag_sha" = "$GITHUB_SHA"
            gh release upload "$RELEASE_VERSION" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_VERSION" --target "$GITHUB_SHA" --title "Flip Game ${RELEASE_VERSION}" --notes-file release-notes.md "${assets[@]}"
          fi
          gh release delete apk-latest --cleanup-tag --yes >/dev/null 2>&1 || true
          gh release create apk-latest --target "$GITHUB_SHA" --title "Flip Game — offline APK (latest)" --notes-file release-notes.md "${assets[@]}"
