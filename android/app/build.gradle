plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mapzimus.flipgame'
    compileSdk 34

    defaultConfig {
        applicationId 'com.mapzimus.flipgame'
        minSdk 24
        targetSdk 34
        versionCode 105
        versionName '1.0.5'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
